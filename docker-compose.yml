# DB + App + Tests en un entorno reproducible.
#   docker compose up --build          → levanta la base, la API (http://localhost:8000/docs) y corre las pruebas
#   docker compose run --rm tests      → solo las pruebas (contra PostgreSQL)
#   docker compose down -v             → apaga todo y borra los datos
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cleanpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cleanpro_local}
      POSTGRES_DB: ${POSTGRES_DB:-cleanpro}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./docker/crear-base-de-pruebas.sql:/docker-entrypoint-initdb.d/01-crear-base-de-pruebas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cleanpro} -d ${POSTGRES_DB:-cleanpro}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: produccion
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cleanpro}:${POSTGRES_PASSWORD:-cleanpro_local}@db:5432/${POSTGRES_DB:-cleanpro}
      APP_ENV: docker
      CARGAR_DATOS_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: .
      target: pruebas
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cleanpro}:${POSTGRES_PASSWORD:-cleanpro_local}@db:5432/cleanpro_pruebas
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
